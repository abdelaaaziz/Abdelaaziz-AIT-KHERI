  <style>:root {
  --blue: #1F3A5F;
  --blue-dark: #162B47;
  --gray-900: #0f1720;
  --gray-600: #1f2a36;
  --gray-300: #B9C2CC;
  --gray-100: #F4F6F8;
  --white: #E8EBEF;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--gray-900);
  background: var(--white);
  line-height: 1.6;
}
a { color: var(--blue); text-decoration: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Navigation */
.nav { position: sticky; top: 0; z-index: 10; background: var(--white); border-bottom: 1px solid var(--gray-300); }
.nav-inner { display: flex; justify-content: space-between; align-items: center; height: 60px; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 1.2rem; color: var(--blue); }
.nav nav { display: flex; gap: 20px; flex-wrap: wrap; }
.nav nav a { color: var(--gray-600); font-size: .95rem; }
.nav nav a { padding: 4px 0; border-bottom: 2px solid transparent; }
.nav nav a:hover { color: var(--blue); }
.nav nav a.active { color: var(--blue); font-weight: 600; border-bottom-color: var(--blue); }
section[id] { scroll-margin-top: 60px; }

/* Hero */
.hero { background: transparent; padding: 70px 0; min-height: calc(100vh - 61px); min-height: calc(100svh - 61px); display: flex; align-items: center; }
.hero { position: relative; overflow: hidden; }
.hero .container { width: 100%; position: relative; z-index: 1; }
.hero-inner { display: flex; align-items: center; gap: 40px; justify-content: space-between; flex-wrap: wrap; }
.hero-text { flex: 1 1 360px; }
.badge { display: inline-block; background: #D5D5D9; color: var(--blue); border: 1px solid var(--blue); padding: 4px 14px; border-radius: 999px; font-size: .85rem; margin-bottom: 16px; }
.badge { display: inline-flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(31, 58, 95, .55); }
  50% { opacity: .35; box-shadow: 0 0 0 6px rgba(31, 58, 95, 0); }
}
.hero h1 { font-size: 4rem; line-height: 1.2; }
.hero h2 { color: var(--blue); font-size: 1.55rem; font-weight: 600; margin: 8px 0 16px; }
.hero p { color: var(--gray-600); max-width: 520px; }
.hero-text > p:not(.badge) { font-size: 1.2rem; max-width: 600px; }

.hero-photo::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--blue); border-radius: 50%; }
.hero-photo img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); border-radius: 50%; object-fit: cover; display: block; }
.buttons { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

/* Boutons */
.btn { display: inline-block; padding: 10px 22px; border-radius: 6px; font-size: .95rem; font-weight: 600; border: 2px solid var(--blue); cursor: pointer; font-family: inherit; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn-outline { background: transparent; color: var(--blue); }
.btn-outline:hover { background: var(--blue); color: #fff; }
.btn-cv { display: inline-flex; align-items: center; gap: 8px; }

/* Sections */
.section { padding: 70px 0; }
.section.alt { background: transparent; }
.title { font-size: 1.8rem; margin-bottom: 32px; text-align: center; }
.title::after { content: ""; display: block; width: 50px; height: 3px; background: var(--blue); margin: 10px auto 0; }
.center { text-align: center; color: var(--gray-600); margin: -12px 0 28px; }

.cards { display: grid; gap: 20px; }
.cards.one { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; }
.cards.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.cards.three { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.cards.four { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

.card { background: var(--gray-100); border: 1px solid var(--gray-300); border-radius: 8px; padding: 24px; }
.card h3 { color: var(--blue); margin-bottom: 10px; font-size: 1.1rem; }
.card p { color: var(--gray-600); font-size: .95rem; }

/* Formation */
.sub { font-size: 1.2rem; margin-bottom: 16px; }
.item { background: var(--gray-100); border-left: 3px solid var(--blue); padding: 14px 18px; margin-bottom: 14px; border-radius: 0 6px 6px 0; border-top: 1px solid var(--gray-300); border-right: 1px solid var(--gray-300); border-bottom: 1px solid var(--gray-300); }
.item h4 { font-size: 1rem; margin: 4px 0; }
.item p { font-size: .92rem; color: var(--gray-600); }
.date { font-size: .82rem; font-weight: 600; color: var(--blue); }
.muted { color: var(--gray-600); font-size: .9rem; }

/* Expériences */
.exp { border: 1px solid var(--gray-300); border-left: 4px solid var(--blue); border-radius: 6px; padding: 22px; margin-bottom: 20px; }
.exp h3 { margin: 6px 0 2px; font-size: 1.1rem; }
.exp ul { margin: 12px 0 14px 20px; color: var(--gray-600); font-size: .95rem; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tags span { background: var(--white); color: var(--gray-900); border: 1px solid var(--gray-300); padding: 2px 12px; border-radius: 999px; font-size: .8rem; }

/* Projets */
.project img { width: 100%; aspect-ratio: 3 / 2; height: auto; object-fit: cover; object-position: center; border-radius: 6px; margin-bottom: 14px; display: block; }
.tag-small { display: inline-block; font-size: .75rem; color: var(--blue); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.link { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; margin-top: 12px; font-size: .95rem; font-family: inherit; }
a.link { display: inline-block; }
.link:hover { text-decoration: underline; }

/* Compétences */
.skill { display: grid; grid-template-columns: 1fr auto; font-size: .88rem; margin-top: 14px; }
.skill b { color: var(--gray-600); font-weight: 600; }
.skill i { grid-column: 1 / -1; height: 6px; background: var(--gray-300); border-radius: 3px; margin-top: 5px; position: relative; overflow: hidden; }
.skill i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--blue); }

/* Contact */
.card .btn { margin-top: 10px; }
.contact-item p a { overflow-wrap: anywhere; }
.contact-item { display: flex; align-items: flex-start; gap: 14px; }
.contact-item .ico { width: 20px; height: 20px; flex-shrink: 0; margin-top: 3px; color: var(--gray-600); }
.card p { margin-bottom: 12px; }

/* Footer */
.footer { background: var(--gray-900); color: #c7d0d8; text-align: center; padding: 22px 0; font-size: .9rem; }

/* Modales */
.modal { display: none; position: fixed; inset: 0; background: rgba(31, 41, 55, .6); align-items: center; justify-content: center; padding: 20px; z-index: 20; }
.modal.open { display: flex; }
.modal-box { background: var(--gray-100); border-radius: 8px; padding: 28px; max-width: 520px; width: 100%; border-top: 4px solid var(--blue); }
.modal-box h3 { color: var(--blue); margin-bottom: 4px; }
.modal-box p { margin-bottom: 14px; color: var(--gray-600); }


























































/* Décor mécatronique */
body { overflow-x: hidden; }
.section { position: relative; }
.section .container { position: relative; z-index: 1; }
.deco { position: absolute; pointer-events: none; z-index: 0; }
.gears-bg { position: fixed; left: 0; bottom: 0; width: 0; height: 0; z-index: -1; pointer-events: none; }
.gears-bg .gear { position: absolute; }
.gear { fill: none; stroke: #1F3A5F; stroke-width: 2; opacity: .22; }
.pair .gear { position: absolute; }
.spin { animation: spin var(--t, 90s) linear infinite; }
.spin.rev { animation-direction: reverse; }
.tr { fill: none; stroke: rgba(11, 18, 26, .3); stroke-width: 2; stroke-linejoin: round; }
.tr circle { fill: #1F3A5F; stroke: none; }
.tr.flip { transform: scaleX(-1); }
.hero-photo { isolation: isolate; }
.photo-tr { left: 0; top: -30px; z-index: -1; overflow: visible; }
.run { display: flex; align-items: flex-start; height: 140px; stroke: rgba(11, 18, 26, .3); }
.run svg { flex: none; fill: none; stroke: rgba(11, 18, 26, .3); stroke-width: 2; stroke-linejoin: round; }
.run circle { fill: #1F3A5F; stroke: none; }
.run .mid { flex: 1; position: relative; align-self: stretch; }
.run .mid::before { content: ""; position: absolute; left: 0; right: 0; top: 94px; height: 2px; background: rgba(11, 18, 26, .3); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 1000px) { .run { display: none; } }
@media (max-width: 800px) { .tr { display: none; } .gear { opacity: .12; } }
@media (prefers-reduced-motion: reduce) { .spin, .dot { animation: none; } }
/* fin décor */

@media (max-width: 600px) {
  .hero h1 { font-size: 2.8rem; }
  .nav-inner { height: auto; padding: 10px 20px; gap: 6px; }
}

/* Tapis de découpe */
.mat-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  background-color: var(--white);
  background-image:
    linear-gradient(to right, rgba(31,58,95,.16) 0 1px, transparent 1px),
    linear-gradient(to top, rgba(31,58,95,.16) 0 1px, transparent 1px),
    linear-gradient(to right, rgba(31,58,95,.12) 0 1px, transparent 1px),
    linear-gradient(to top, rgba(31,58,95,.12) 0 1px, transparent 1px),
    linear-gradient(to right, rgba(31,58,95,.06) 0 1px, transparent 1px),
    linear-gradient(to top, rgba(31,58,95,.06) 0 1px, transparent 1px);
  background-size: 240px 240px, 240px 240px, 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  background-position: left bottom; }
.mat-bg svg { position: absolute; left: 0; bottom: 0; }
@media (max-width: 700px) { .mat-bg { opacity: .6; } }
/* fin tapis */


/* Filtre chaud permanent (éclairage nocturne, intensité moyenne) */
/* fin filtre */

/* Éclairage nocturne */
.nav-right { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.night-toggle { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; color: var(--blue); background: transparent; border: 1.5px solid var(--blue); border-radius: 50%; cursor: pointer; transition: background .2s, color .2s; }
.night-toggle:hover { background: rgba(31, 58, 95, .08); }
.night-toggle[aria-pressed="true"] { background: var(--blue); color: #fff; }

.nightlight { position: fixed; inset: 0; z-index: 9999; pointer-events: none; background: rgb(255, 176, 100); mix-blend-mode: multiply; opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s linear .5s; }

/* Certifications */
.edu-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 24px; margin-bottom: 18px; }

<script>// Éclairage nocturne (même réglage que le portfolio, état partagé)
(function () {
  var btn = document.getElementById('nightToggle');
  var layer = document.getElementById('nightlight');
  if (!btn || !layer) return;
  function apply(on) {
    layer.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? "Désactiver l'éclairage nocturne" : "Activer l'éclairage nocturne";
  }
  var saved = false;
  try { saved = localStorage.getItem('nightlight') === '1'; } catch (e) {}
  apply(saved);
  btn.addEventListener('click', function () {
    var on = !layer.classList.contains('on');
    apply(on);
    try { localStorage.setItem('nightlight', on ? '1' : '0'); } catch (e) {}
  });
})();

// Menu : section active pendant le défilement
(function () {
  var links = [].slice.call(document.querySelectorAll('.nav nav a[href^="#"]'));
  var secs = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
  function spy() {
    var y = window.scrollY + 120, cur = -1;
    secs.forEach(function (s, i) { if (s && s.getBoundingClientRect().top + window.scrollY <= y) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle('active', i === cur); });
  }
  window.addEventListener('scroll', spy, { passive: true });
  spy();
})();
</script>
