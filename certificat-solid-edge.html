<script>// Éclairage nocturne (même réglage que le portfolio, état partagé)
(function () {
  var btn = document.getElementById('nightToggle');
  var layer = document.getElementById('nightlight');
  if (!btn || !layer) return;
  function apply(on) {
    layer.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? "Turn off night light" : "Turn on night light";
  }
  var saved = false;
  try { saved = localStorage.getItem('nightlight') === '1'; } catch (e) {}
  apply(saved);
  btn.addEventListener('click', function () {
    var on = !layer.classList.contains('on');
    apply(on);
    try { localStorage.setItem('nightlight', on ? '1' : '0'); } catch (e) {}
  });
})();

// Menu : section active pendant le défilement
(function () {
  var links = [].slice.call(document.querySelectorAll('.nav nav a[href^="#"]'));
  var secs = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
  function spy() {
    var y = window.scrollY + 120, cur = -1;
    secs.forEach(function (s, i) { if (s && s.getBoundingClientRect().top + window.scrollY <= y) cur = i; });
    links.forEach(function (a, i) { a.classList.toggle('active', i === cur); });
  }
  window.addEventListener('scroll', spy, { passive: true });
  spy();
})();

// Ajuste la largeur de chaque pastille de l'anatomie au texte (centrée sur le même point)
(function () {
  function fit() {
    document.querySelectorAll('.anatomy svg .anat-pill').forEach(function (r) {
      var t = r.nextElementSibling; if (!t || !t.getBBox) return;
      var b = t.getBBox(), w = b.width + 22, cx = parseFloat(t.getAttribute('x'));
      r.setAttribute('width', w.toFixed(1)); r.setAttribute('x', (cx - w / 2).toFixed(1));
    });
  }
  fit(); window.addEventListener('load', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
